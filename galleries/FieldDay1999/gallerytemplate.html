    <style>
      :root {
        --navy: #0f1f3d;
        --navy-light: #162a52;
        --navy-dark: #0a152b;
        --electric: #2563eb;
        --electric-hover: #1d4ed8;
        --electric-light: #3b82f6;
        --white: #ffffff;
        --surface: #f8fafc;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --shadow-sm: 0 1px 3px rgba(15, 31, 61, 0.08);
        --shadow-md: 0 4px 16px rgba(15, 31, 61, 0.1);
        --shadow-lg: 0 8px 32px rgba(15, 31, 61, 0.12);
        --shadow-card: 0 2px 8px rgba(15, 31, 61, 0.06);
        --radius: 12px;
        --radius-lg: 16px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Sticky Header */
      .header-scrolled {
        box-shadow: 0 2px 20px rgba(15, 31, 61, 0.3) !important;
        backdrop-filter: blur(12px);
      }

      /* Radio Wave Animation */
      @keyframes radioWave {
        0% {
          transform: scale(0.3);
          opacity: 0.8;
        }
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }

      .radio-wave {
        position: absolute;
        width: 120px;
        height: 120px;
        border: 2px solid rgba(37, 99, 235, 0.5);
        border-radius: 50%;
        animation: radioWave 3s ease-out infinite;
      }

      .radio-wave:nth-child(2) { animation-delay: 0.6s; }
      .radio-wave:nth-child(3) { animation-delay: 1.2s; }
      .radio-wave:nth-child(4) { animation-delay: 1.8s; }
      .radio-wave:nth-child(5) { animation-delay: 2.4s; }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); }
        50% { box-shadow: 0 0 40px rgba(37, 99, 235, 0.6); }
      }

      .pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      /* Section fade-in */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .section-animate {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }

      .section-animate.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Card hover */
      .card-hover {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
      }

      /* Button transitions */
      .btn-primary {
        background: var(--electric);
        color: var(--white);
        padding: 14px 32px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }

      .btn-primary:hover {
        background: var(--electric-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      }

      .btn-ghost {
        background: transparent;
        color: var(--white);
        padding: 14px 32px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        border: 2px solid rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }

      .btn-ghost:hover {
        border-color: var(--white);
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }

      /* Nav active */
      .nav-link {
        position: relative;
        color: rgba(255, 255, 255, 0.75);
        transition: color 0.25s ease;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 6px 0;
      }

      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--electric);
        transition: width 0.3s ease;
        border-radius: 1px;
      }

      .nav-link:hover,
      .nav-link.active {
        color: var(--white);
      }

      .nav-link.active::after,
      .nav-link:hover::after {
        width: 100%;
      }

      /* Antenna SVG */
      .antenna-tower {
        filter: drop-shadow(0 0 12px rgba(37, 99, 235, 0.4));
      }

      /* Badge */
      .callsign-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, var(--electric), var(--electric-light));
        color: white;
        padding: 8px 20px;
        border-radius: 40px;
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: 2px;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      }

      /* Section padding */
      .section-padding {
        padding: 48px 0;
      }

      @media (min-width: 768px) {
        .section-padding {
          padding: 80px 0;
        }
      }

      /* Solar placeholder */
      .solar-widget {
        background: linear-gradient(135deg, #0a152b, #162a52);
        border: 1px solid rgba(37, 99, 235, 0.2);
        border-radius: var(--radius-lg);
        padding: 24px;
        color: white;
      }

      .band-indicator {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 500;
      }

      .band-good { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
      .band-fair { background: rgba(250, 204, 21, 0.15); color: #facc15; }
      .band-poor { background: rgba(239, 68, 68, 0.15); color: #f87171; }

      /* Form inputs */
      .form-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        transition: border-color 0.25s ease;
        outline: none;
      }

      .form-input:focus {
        border-color: var(--electric);
        background: rgba(255, 255, 255, 0.08);
      }

      .form-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      /* Frequency badge */
      .freq-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(37, 99, 235, 0.05));
        border: 1px solid rgba(37, 99, 235, 0.2);
        color: var(--electric);
        padding: 6px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.85rem;
        font-family: 'Inter', monospace;
      }

      /* Mobile menu animation */
      .mobile-menu-enter {
        animation: slideDown 0.3s ease forwards;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ARES shield */
      .ares-shield {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--electric), #1d4ed8);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
      }

      /* Scroll indicator */
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(8px); }
      }

      .scroll-indicator {
        animation: bounce 2s ease-in-out infinite;
      }

      /* Meeting card styles */
      .meeting-card {
        position: relative;
        border-radius: 16px;
        padding: 24px;
        border: 1px solid #e2e8f0;
        background: white;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .meeting-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
      }

      .meeting-card.past {
        opacity: 0.55;
        background: #f9fafb;
      }

      .meeting-card.past:hover {
        opacity: 0.75;
      }

      .meeting-card.upcoming {
        border-color: rgba(37, 99, 235, 0.15);
        background: white;
      }

      .meeting-card.next-meeting {
        border-color: var(--electric);
        border-width: 2px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.03), rgba(37, 99, 235, 0.08));
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.12);
      }

      .meeting-card.next-meeting:hover {
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.2);
      }

      .meeting-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .badge-past {
        background: #f1f5f9;
        color: #94a3b8;
      }

      .badge-next {
        background: linear-gradient(135deg, var(--electric), var(--electric-light));
        color: white;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      }

      .badge-upcoming {
        background: #ecfdf5;
        color: #059669;
      }

      .badge-note {
        background: #fef3c7;
        color: #92400e;
        font-size: 0.65rem;
      }

      .location-bar {
        background: linear-gradient(135deg, #0a152b, #162a52);
        border: 1px solid rgba(37, 99, 235, 0.2);
        border-radius: 16px;
        padding: 20px 24px;
        color: white;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .pulse-dot {
        animation: pulse-dot 2s ease-in-out infinite;
      }

       .minutes-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
          }

        .minutes-table thead {

        .minutes-table th, .minutes-table td {

        }

        .minutes-table tbody tr:nth-child(even) {
            background: #f5f7fa;
        }

        .minutes-table a {
            color: #0a4fff;
            font-weight: 600;
            text-decoration: none;
          }

        .minutes-table a:hover {
            text-decoration: underline;
          }      
        #galleria,
        #galleria-container,
        #gallery {
            min-height: 700px;
        }

        .galleria-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(15,31,61,.12);
        }          
    </style>
  
</head>

      var mobileMenuClose = document.getElementById('mobile-menu-close-j0k1');

      if (mobileMenuBtn && mobileMenu) {
        mobileMenuBtn.addEventListener('click', function() { mobileMenu.classList.remove('hidden'); });
      }
      if (mobileMenuClose && mobileMenu) {
        mobileMenuClose.addEventListener('click', function() { mobileMenu.classList.add('hidden'); });
      }
      document.querySelectorAll('.mobile-nav-link').forEach(function(link) {
        link.addEventListener('click', function() { if (mobileMenu) mobileMenu.classList.add('hidden'); });
      });
      // Sticky header shadow
      var header = document.getElementById('site-header-h7k2');
      window.addEventListener('scroll', function() {
        if (header) {
          header.classList.toggle('header-scrolled', window.scrollY > 20);
        }
      });
      // Fade-in sections
      var animateSections = document.querySelectorAll('.section-animate');
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        animateSections.forEach(function(s) { observer.observe(s); });
      } else {
        animateSections.forEach(function(s) { s.classList.add('visible'); });
      }
      // Contact form demo
      var contactForm = document.getElementById('contact-form-r0s1');
      if (contactForm) {
        contactForm.addEventListener('submit', function(e) {
          e.preventDefault();
          var btn = document.getElementById('contact-submit-z0a1');
          var orig = btn.innerHTML;
          btn.innerHTML = '<span>&#10003; Message Sent (Demo)</span>';
          btn.style.background = '#16a34a';
          btn.disabled = true;
          setTimeout(function() {
            btn.innerHTML = orig; btn.style.background = ''; btn.disabled = false; contactForm.reset();
            if (typeof lucide !== "undefined") lucide.createIcons();
          }, 2500);
        });
      }
    </script>
</body>
</html>
